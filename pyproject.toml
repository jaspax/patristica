[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patristica"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]",
    "lxml",
    "beautifulsoup4",
    "pydantic>=2",
    "tqdm",
    "python-slugify",
    "tiktoken",
    # NOTE: beta-code conversion for CCAT LXX betacode → Unicode is handled
    # per-ingestor. No stable PyPI package exists; add a vendored converter
    # or a suitable package (e.g. "betacode") when that source is implemented.
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "ruff", "mypy"]
usfm = ["usfm-grammar"]  # requires Node.js

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["patristica", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
