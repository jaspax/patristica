[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patristica"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx[http2]",
    "lxml",
    "beautifulsoup4",
    "pydantic>=2",
    "tqdm",
    "python-slugify",
    "tiktoken",
    # NOTE: beta-code conversion for CCAT LXX betacode → Unicode is handled
    # per-ingestor. No stable PyPI package exists; add a vendored converter
    # or a suitable package (e.g. "betacode") when that source is implemented.
    "playwright>=1.59.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "ruff", "mypy"]
usfm = ["usfm-grammar"]  # requires Node.js
deploy = ["boto3"]  # scripts.upload_library, scripts.bootstrap_infra (DigitalOcean Spaces, S3 API)
api = ["fastapi", "uvicorn[standard]", "psycopg[binary]", "psycopg-pool", "numpy"]  # api/ (FastAPI backend, #117; search #141)
embed = ["numpy"]  # scripts.embed: corpus vectors via patristica.embedders (#136)
index = ["numpy", "psycopg[binary]"]  # scripts.build_index: load the search database (#137)
eval = ["numpy", "httpx", "anthropic"]  # scripts.embed_eval: dense retrieval, API embedders, translation eval
eval-local = ["numpy", "sentence-transformers", "torch"]  # local embedders (CPU torch; not in CI)
pipeline = ["patristica[embed,index,deploy,eval]"]  # scripts.pipeline: every step in one run (#248)

[project.scripts]
pipeline = "scripts.pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["patristica", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

# CPU-only torch for the local embedding eval (the default PyPI wheel pulls in CUDA).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
