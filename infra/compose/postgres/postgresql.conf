# Postgres 16 settings for the 16 GB / 2 vCPU memory-optimized database host
# (m-2vcpu-16gb, #252; first sized for 8 GB in #117).
#
# Sized for the HNSW index on 512-dim halfvec over ~4.0M vectors
# (chunk_vectors_hnsw_m1, ~5.2 GB, growing ~1.3 GB per million vectors).
# The budget, roughly:
#   shared_buffers                          4 GB
#   OS, Docker, api, web, caddy           ~1.5 GB
#   OS page cache                        ~10.5 GB
# The page cache holds the whole index (prewarmed with pg_prewarm 'prefetch'
# after the stack starts and after the nightly pg_dump: compose/postgres/
# prewarm.sh) plus chunks_pkey and passage_groups_pkey, about 6 GB together.
# The heaps (chunk_vectors ~5.3 GB, chunks ~2.4 GB) don't all fit; their hot
# pages share the rest. That keeps the index cached up to roughly 7-8M vectors.
# effective_cache_size tells the planner about shared_buffers + page cache.

listen_addresses = '*'          # container network only; no published port
max_connections = 50

# Memory
shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 32MB
# Default for VACUUM, small index builds etc. A full HNSW build raises it in
# its own session (build_index --maintenance-work-mem, 4GB by default, up to
# 8GB here); the db container's shm_size must stay larger (#166, infra/README.md).
maintenance_work_mem = 1GB
huge_pages = try

# Parallelism (2 vCPU)
max_worker_processes = 8
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# SSD block storage
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL
wal_compression = on
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9

# autoprewarm reloads shared_buffers after a restart; compose/postgres/
# prewarm.sh loads the HNSW index and the key indexes into the OS page cache.
shared_preload_libraries = 'pg_prewarm'
pg_prewarm.autoprewarm = on

# Logging (to the container's stderr, rotated by Docker)
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_timezone = 'UTC'
timezone = 'UTC'
