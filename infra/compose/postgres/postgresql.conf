# Postgres 16 settings for the 8 GB / 4 vCPU database host (#117).
#
# Sized for an HNSW index on 512-dim halfvec over ~4.0M vectors (about
# 5-5.5 GB). shared_buffers stays moderate and the rest of the index is held
# in the OS page cache, which effective_cache_size tells the planner about.
# If the index stops fitting in cache (slow queries, high disk reads in DO
# monitoring), resize the droplet to 16 GB and double the memory settings.

listen_addresses = '*'          # container network only; no published port
max_connections = 50

# Memory
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
# Default for VACUUM etc. The index build raises it in its own session:
#   SET maintenance_work_mem = '4GB';  (see infra/README.md)
maintenance_work_mem = 512MB
huge_pages = try

# Parallelism (4 vCPU)
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 3

# SSD block storage
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL
wal_compression = on
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9

# pg_prewarm reloads shared_buffers after a restart; warm the rest with
#   SELECT pg_prewarm('<hnsw index name>');
shared_preload_libraries = 'pg_prewarm'
pg_prewarm.autoprewarm = on

# Logging (to the container's stderr, rotated by Docker)
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_timezone = 'UTC'
timezone = 'UTC'
