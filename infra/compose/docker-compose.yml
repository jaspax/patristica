# Production stack on the database host (#117); see infra/README.md.
# On the droplet, infra/deploy.sh writes .env next to this file. Locally,
# copy .env.local.example to .env to run the same stack over plain HTTP.

name: patristica

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: patristica
      POSTGRES_DB: patristica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # On the droplet: /mnt/pgdata/postgres (the block-storage volume).
      - ${PGDATA_DIR:-pgdata}:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    # Docker's default 64 MB /dev/shm is too small for parallel index builds.
    shm_size: 1g
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "patristica", "-d", "patristica"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  api:
    build:
      context: ${SRC_DIR:-../..}
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://patristica:${POSTGRES_PASSWORD}@db:5432/patristica
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  caddy:
    image: caddy:2.11.6
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
