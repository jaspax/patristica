name: CI

# Runs on PRs only: everything reaches master through a PR (the pre-push hook
# blocks direct pushes). Before merging, re-run a PR's checks if master has
# moved since its last run; use workflow_dispatch to check master itself.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, self-contained tests (the same suite the pre-push hook runs).
  # Tests that need downloaded source data under data/raw/ skip themselves.
  # Heavier suites (pipeline/integration, data validation) go in their own jobs below.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # The same image as production; tests that need a database (search index,
    # #137) use it through PATRISTICA_TEST_DATABASE_URL and skip without it.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: patristica
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: patristica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patristica" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PATRISTICA_TEST_DATABASE_URL: postgresql://patristica:ci@localhost:5432/patristica
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra eval --extra api --extra deploy --extra index

      - name: Run unit tests
        run: uv run pytest

  # Pipeline freshness (#130). The hard checks (stale normalized data or
  # alignments) are pytest tests in unit-tests; this job reports what CI can't
  # run (pending translations and their cost) in the job summary, and runs
  # scripts.validate when a file it reads changed: it fails on validation
  # errors and lists the warning counts. Needs no raw data or API keys.
  pipeline:
    name: Pipeline status and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR checks out its merge commit: HEAD^1 is the base, so the PR's
          # changes are `git diff HEAD^1 HEAD` without fetching any history.
          fetch-depth: 2

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra eval

      - name: Pipeline status
        run: uv run python -m scripts.status --summary "$GITHUB_STEP_SUMMARY"

      - name: Validate (when its inputs changed)
        # Also when the status step failed: they check different things.
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="--if-changed HEAD^1"
          fi
          uv run python -m scripts.validate $changed --output "$RUNNER_TEMP/validation_report.json" \
            --summary "$GITHUB_STEP_SUMMARY"

  # Next.js frontend (web/): lint, typecheck, unit tests, production build.
  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Hosting as code (infra/, #117): OpenTofu config, cloud-init, compose stack,
  # shell scripts. Offline checks only; nothing here touches DigitalOcean.
  infra:
    name: Infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1

      - name: tofu fmt
        run: tofu -chdir=infra/tofu fmt -check -recursive

      - name: tofu validate
        run: |
          tofu -chdir=infra/tofu init -backend=false -input=false
          tofu -chdir=infra/tofu validate

      - name: cloud-init schema
        run: |
          command -v cloud-init || sudo apt-get install -y -q cloud-init
          sed 's#${volume_device}#/dev/disk/by-id/scsi-0DO_Volume_test#g' \
            infra/tofu/cloud-init.yaml > "$RUNNER_TEMP/cloud-init.yaml"
          cloud-init schema -c "$RUNNER_TEMP/cloud-init.yaml"

      - name: docker compose config
        working-directory: infra/compose
        run: cp .env.local.example .env && docker compose config -q

      - name: Caddyfile
        working-directory: infra/compose
        run: |
          docker run --rm --env-file .env.local.example \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.6 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # The image the droplet runs (#132); the web job above only checks npm run build.
      - name: web image
        working-directory: infra/compose
        run: docker compose build web

      - name: shellcheck
        run: shellcheck infra/*.sh infra/compose/backup/*.sh
