name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, self-contained tests (the same suite the pre-push hook runs).
  # Tests that need downloaded source data under data/raw/ skip themselves.
  # Heavier suites (pipeline/integration, data validation) go in their own jobs below.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run unit tests
        run: uv run pytest
