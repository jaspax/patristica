name: CI

# Runs on PRs only: everything reaches master through a PR (the pre-push hook
# blocks direct pushes). Before merging, re-run a PR's checks if master has
# moved since its last run; use workflow_dispatch to check master itself.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, self-contained tests (the same suite the pre-push hook runs).
  # Tests that need downloaded source data under data/raw/ skip themselves.
  # Heavier suites (pipeline/integration, data validation) go in their own jobs below.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run unit tests
        run: uv run pytest

  # Next.js frontend (web/): lint, typecheck, unit tests, production build.
  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
