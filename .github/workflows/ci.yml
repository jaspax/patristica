name: CI

# Runs on PRs only: everything reaches master through a PR (the pre-push hook
# blocks direct pushes). Before merging, re-run a PR's checks if master has
# moved since its last run; use workflow_dispatch to check master itself.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, self-contained tests (the same suite the pre-push hook runs).
  # Tests that need downloaded source data under data/raw/ skip themselves.
  # Heavier suites (pipeline/integration, data validation) go in their own jobs below.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra eval --extra api --extra deploy

      - name: Run unit tests
        run: uv run pytest

  # Next.js frontend (web/): lint, typecheck, unit tests, production build.
  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Hosting as code (infra/, #117): OpenTofu config, cloud-init, compose stack,
  # shell scripts. Offline checks only; nothing here touches DigitalOcean.
  infra:
    name: Infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1

      - name: tofu fmt
        run: tofu -chdir=infra/tofu fmt -check -recursive

      - name: tofu validate
        run: |
          tofu -chdir=infra/tofu init -backend=false -input=false
          tofu -chdir=infra/tofu validate

      - name: cloud-init schema
        run: |
          command -v cloud-init || sudo apt-get install -y -q cloud-init
          sed 's#${volume_device}#/dev/disk/by-id/scsi-0DO_Volume_test#g' \
            infra/tofu/cloud-init.yaml > "$RUNNER_TEMP/cloud-init.yaml"
          cloud-init schema -c "$RUNNER_TEMP/cloud-init.yaml"

      - name: docker compose config
        working-directory: infra/compose
        run: cp .env.local.example .env && docker compose config -q

      - name: Caddyfile
        working-directory: infra/compose
        run: |
          docker run --rm --env-file .env.local.example \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.6 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # The image the droplet runs (#132); the web job above only checks npm run build.
      - name: web image
        working-directory: infra/compose
        run: docker compose build web

      - name: shellcheck
        run: shellcheck infra/*.sh infra/compose/backup/*.sh
