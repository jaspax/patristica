name: CI · Web app

# One of the per-area CI workflows (#435; the list is in ci-python.yml): it runs
# only on PRs that touch the paths below. workflow_dispatch checks master.
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Next.js frontend (web/): lint, typecheck, unit tests, production build.
  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
