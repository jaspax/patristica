name: Publish library

# Export data/normalized as the static library and sync it to the DigitalOcean
# Spaces bucket that the deployed web app reads through its CDN (#131; bucket,
# CDN and upload key are in infra/tofu; see scripts/upload_library.py).
# Uploads only changed files, so a run with no data changes uploads nothing.

on:
  push:
    branches: [master]
    paths:
      - "data/normalized/**"
      - "patristica/sources.py"
      - "patristica/models.py"
      - "scripts/export_library.py"
      - "scripts/upload_library.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish-library.yml"
  workflow_dispatch:

# Never run two uploads at once; queue instead of cancelling a running sync.
concurrency:
  group: publish-library
  cancel-in-progress: false

permissions:
  contents: read

env:
  TQDM_DISABLE: "1"   # no progress bars in the Actions log

jobs:
  publish:
    name: Export and upload to Spaces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra deploy

      - name: Export library
        run: uv run python -m scripts.export_library

      - name: Upload to Spaces
        env:
          LIBRARY_ACCESS_KEY_ID: ${{ secrets.LIBRARY_ACCESS_KEY_ID }}
          LIBRARY_SECRET_ACCESS_KEY: ${{ secrets.LIBRARY_SECRET_ACCESS_KEY }}
          LIBRARY_BUCKET: patristica-library   # infra/tofu: var.library_bucket
          LIBRARY_REGION: nyc3                 # infra/tofu: var.region
        run: uv run python -m scripts.upload_library
